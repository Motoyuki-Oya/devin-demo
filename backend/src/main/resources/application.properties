# Core settings
quarkus.http.port=8080

# Cell Identity
cell.id=cell-01

# Redis (Dragonfly) configuration
quarkus.redis.hosts=redis://localhost:6379
# 高同時接続時の INCR/PUBLISH バーストに備えたプール拡張（デフォルト: size=6, waiting=24）
quarkus.redis.max-pool-size=16
quarkus.redis.max-pool-waiting=1024

# WebSocket hardening
# ClientMessage(IncrementRequest)は数十バイトのため、巨大フレームによるメモリ枯渇を防ぐ
quarkus.websocket.max-frame-size=4096
# メッセージ処理を IO スレッドではなくワーカースレッドへディスパッチ
quarkus.websocket.dispatch-to-worker=true

# CSWSH（Cross-Site WebSocket Hijacking）対策:
# ブラウザからの handshake で許可する Origin（カンマ区切り）。
# Origin ヘッダを送らない非ブラウザクライアント（負荷試験ツール等）は制限対象外。
# 本番ではフロントエンドの公開ドメインに置き換えること。
edgecell.allowed-origins=http://localhost:4321,https://localhost:4321,http://127.0.0.1:4321,https://127.0.0.1:4321

# Java 25 / Loom support
quarkus.run-java-arguments=--enable-preview
quarkus.virtual-threads.enabled=true

# SSL / TLS Configuration
#
# TLS 終端戦略:
#   - dev:  Cell が自前で TLS 終端（自己署名証明書、port 8443）
#   - prod: Cloudflare が公開 TLS を終端し、Cell へは Origin CA 証明書で再暗号化
#
# 暗号強度（AES-256-GCM / ChaCha20 等）はどちらも同一。
# Cell の CPU 負荷が低い理由:
#   1. Origin CA の証明書チェーンが短い（中間CA 1段のみ）
#   2. OCSP 失効確認が不要
#   3. Cloudflare が長期接続を維持するため Cell 側のハンドシェイク数が大幅に少ない
#

# Dev: Self-signed certs for local WebSocket testing
%dev.quarkus.http.ssl.certificate.key-files=src/main/resources/certs/key.pem
%dev.quarkus.http.ssl.certificate.files=src/main/resources/certs/cert.pem
%dev.quarkus.http.ssl.port=8443
%dev.quarkus.http.insecure-requests=redirect

# Prod: Cloudflare Origin CA cert (generate via Cloudflare Dashboard → SSL/TLS → Origin Server)
# Place origin cert/key at deploy time; paths below are placeholders.
%prod.quarkus.http.ssl.certificate.key-files=/etc/edgecell/certs/origin-key.pem
%prod.quarkus.http.ssl.certificate.files=/etc/edgecell/certs/origin-cert.pem
%prod.quarkus.http.ssl.port=8443
%prod.quarkus.http.insecure-requests=disabled

# TLS 1.3 のみ許可（Architecture.md の方針: TLS 1.3 / AES-256-GCM / ECDHE）
quarkus.http.ssl.protocols=TLSv1.3
